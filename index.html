<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0e1615" />
        <meta name="description" content="Make your work matter. Take on real business problems from organisations, get your work verified, and build a profile that shows what you can do." />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- Link previews (WhatsApp, LinkedIn, X). After deploying, replace /og.png with the full URL, e.g. https://yourdomain.com/og.png -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="KIVO" />
        <meta property="og:title" content="KIVO — Make your work matter" />
        <meta property="og:description" content="Take on real business problems, get your work verified, and build a profile that shows what you can do." />
        <meta property="og:image" content="/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="KIVO — Make your work matter" />
        <meta name="twitter:description" content="Take on real business problems, get your work verified, and build a profile that shows what you can do." />
        <meta name="twitter:image" content="/og.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
        <title>KIVO — Make your work matter</title>
        <script>try{if(localStorage.getItem("kivo_theme")!=="light")document.documentElement.classList.add("dark")}catch(e){document.documentElement.classList.add("dark")}</script>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.js"></script>
    </body>
</html>
